# CNN-LSTM hybrid model for temporal arc detection
name: cnn_lstm

# CNN feature extractor
cnn:
  in_channels: 6
  channel_sizes: [32, 64, 128]
  kernel_sizes: [7, 5, 3]
  pool_size: 2
  dropout: 0.2
  activation: gelu

# LSTM temporal encoder
lstm:
  hidden_size: 128
  num_layers: 2
  dropout: 0.3
  bidirectional: true

# Self-attention over LSTM outputs
attention:
  embed_dim: 256  # 128 * 2 for bidirectional
  num_heads: 4
  dropout: 0.1

# Classification head
classifier:
  hidden_dims: [128, 64]
  dropout: 0.4
  num_classes: 2       # arc / no-arc
  predict_severity: true  # additional regression head for severity score
